name: report-formats-ci

# Compila o "Suricatoos Premium PDF" na imagem de PRODUCAO do gvmd em todo PR
# que toca report-formats/. O report-formats-publish so' roda no push da main e
# so' confere os feed XMLs; nunca rodou xsltproc/pdflatex, entao um PR que
# quebrava o LaTeX so' aparecia em producao.
#
# Jobs:
#   feed-sync  os 9 feed XMLs versionados (3 edicoes x 3 idiomas) e o
#              manifest.json batem com o bundle (build-feed-xml.py), nenhum
#              objeto gerado fica fora do repositorio, e o manifesto descreve
#              exatamente os objetos (ci/check-manifest.py: UUID, nome, idioma
#              e edicao do generate embutido);
#   compile    por idioma x edicao (technical, client, executive -- os nomes
#              do contrato da frota, ADR-0011): `sh ./generate` ponta a ponta
#              + compilacao de
#              diagnostico de cada fixture -- sample, tortura e as de
#              veracidade (report-formats/tests/fixtures/, uma por defeito ja'
#              corrigido) -- com os portoes de log/fontes/links/destinos, o de
#              veracidade (check-veracity.py: o .tex diz a verdade sobre o XML)
#              e o de navegacao (check-navigation.py: a pagina de sumario e a
#              arvore de marcadores do PDF entregue), todos em
#              report-formats/ci/gates.sh; o controle negativo (o generate tem
#              de falhar alto) e os artefatos (PDFs, .log, .tex, .aux, .out,
#              PNG das 3 primeiras paginas -- com o resumo executivo numa
#              folha so', a 3a e' a de sumario);
#   measure    NAO bloqueia: tempo e pico de memoria do generate (edicao
#              tecnica x edicao do cliente, um idioma) num export sintetico
#              grande (ci/big-report.py, dezenas de milhares de resultados,
#              dado inventado), na imagem do gvmd, escritos no resumo do job.
#              Sem limite ainda.
on:
  pull_request:
    paths:
      - 'report-formats/**'
      - '.github/workflows/report-formats-ci.yml'
  push:
    branches: [main]
    paths:
      - 'report-formats/**'
      - '.github/workflows/report-formats-ci.yml'

permissions:
  contents: read

concurrency:
  group: report-formats-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GVMD_IMAGE: registry.community.greenbone.net/community/gvmd:stable

jobs:
  feed-sync:
    name: feed XML em sincronia com o bundle
    # Imagem fixa, como a do compile abaixo: trocar de Ubuntu e' mudanca deliberada, nao efeito do ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerar os feed XMLs e o manifesto a partir do bundle e comparar
        run: |
          set -eux
          python3 report-formats/build-feed-xml.py
          # Falha se o XML ou o manifesto versionado divergir do bundle:
          # regenere e commite.
          git diff --exit-code report-formats/pdf-suricatoos-*.xml report-formats/manifest.json \
            report-formats/suricatoos-premium-pdf/report_format.xml
          # O git diff nao ve arquivo NOVO: um objeto que o build escreve e o
          # commit esqueceu passaria. Nada sob report-formats/ pode ficar fora.
          test -z "$(git status --porcelain --untracked-files=all -- report-formats)"

      - name: Manifesto = objetos de feed (UUID, nome, idioma e edicao)
        run: python3 report-formats/ci/check-manifest.py

  compile:
    name: compila no gvmd:stable (${{ matrix.lang }}, ${{ matrix.variant }})
    # pdf-texto le o `pdftotext -layout` do poppler 24.02 desta imagem (outro poppler/xpdf quebra a regex do sumario e o portao reprova); ubuntu-latest esta migrando, entao trocar e' deliberado.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Idioma x edicao: cada objeto de feed tem o seu job, com TODAS as fixtures
    # (nenhuma cobertura cortada por edicao). Os 9 jobs rodam em paralelo.
    strategy:
      fail-fast: false
      matrix:
        lang: [en, pt_BR, es]
        variant: [technical, client, executive]
    env:
      REPORT_LANG: ${{ matrix.lang }}
      REPORT_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: poppler-utils no runner (pdffonts, pdfinfo, pdftoppm, pdftotext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          # A versao fica no log: o pdf-texto foi calibrado no pdftotext 24.02.
          pdftotext -v 2>&1 | head -n 1

      - name: Compilar (sample + tortura) e aplicar os portoes
        run: report-formats/ci/compile.sh "$REPORT_LANG" "$REPORT_VARIANT" "$RUNNER_TEMP/artefatos"

      - name: Controle negativo (o generate tem de falhar alto)
        if: ${{ !cancelled() }}
        run: report-formats/ci/negative-control.sh "$REPORT_LANG" "$REPORT_VARIANT" "$RUNNER_TEMP/artefatos"

      - name: Publicar PDFs, logs e previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-formats-${{ matrix.lang }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/artefatos/
          if-no-files-found: warn
          retention-days: 14

  measure:
    name: medicao de um export grande (nao bloqueia)
    # Medicao, NAO portao: o script sai 0 sempre e o job e' continue-on-error.
    # Quanto custa a copia do relatorio da edicao do cliente num export com
    # dezenas de milhares de resultados (revisao da R5). Um idioma so'.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: poppler-utils no runner (pdfinfo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Medir tecnico x cliente num export sintetico grande (en)
        run: report-formats/ci/measure-big.sh en "$RUNNER_TEMP/medida"
