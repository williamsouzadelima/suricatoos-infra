name: gmp-bridge-ci

on:
  push:
    branches: [main, "feat/**"]
    # fleet_ops outputs are validated against the ADR-0011 schemas, and its request validation
    # against the contract's command examples: a change to either re-runs it.
    paths: ["gmp-bridge/**", "schema/fleet-*.json", "schema/examples/fleet/**", ".github/workflows/gmp-bridge-ci.yml"]
  pull_request:
    paths: ["gmp-bridge/**", "schema/fleet-*.json", "schema/examples/fleet/**", ".github/workflows/gmp-bridge-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gmp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            gmp-bridge/requirements.txt
            gmp-bridge/requirements-test.txt
      - name: install deps
        # requirements-test.txt (jsonschema, pinned) is test-only: the schemas are loaded
        # OFFLINE from ../schema with a local registry.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt pytest
      - name: pytest
        run: python -m pytest -q
