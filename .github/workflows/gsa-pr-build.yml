name: gsa-pr-build

# Valida em PR o patch da UI (greenbone/gsa + patches/gsa-*.patch) e o do gsad
# ANTES do merge: aplica os dois nas tags pinadas, roda o type-check (tsc) e o
# build de produção (Vite) da UI, confere os catálogos de idioma e as chaves
# das telas da Suricatoos neles, confere que o bundle traz as fontes sem chamar
# um serviço de terceiros e roda a suíte vitest INTEIRA do GSA (os testes do
# upstream e os que o patch traz): falha de qualquer teste reprova o PR, na
# primeira falha, e erro não tratado também (o vitest sai com 1 mesmo com todos
# os testes passando).
# Não publica nada, não usa secrets e não faz login em registry: a publicação
# continua só no build-publish.yml (push na main).
on:
  pull_request:
    paths:
      - 'patches/**'
      - '.github/workflows/gsa-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsa-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: aplica patches + type-check + build (GSA)
    runs-on: ubuntu-latest
    # A suíte inteira do GSA (~7.500 testes, 787 arquivos) leva ~11 min no runner
    # de 4 vCPU (10 min 40 s só o vitest, na run da PR #155) e de 7 a 11 min numa
    # máquina de desenvolvimento rápida.
    timeout-minutes: 60
    env:
      # Folga de heap para o tsc e o Vite (runner com 16 GB).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout (patches + workflow)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Mesma lógica do build-publish.yml: a tag vem do nome do arquivo do patch.
      - name: Derivar tags pinadas a partir dos nomes dos patches
        id: refs
        run: |
          set -eu
          if [ "$(ls patches/gsa-*.patch | wc -l)" -gt 1 ] || [ "$(ls patches/gsad-*.patch | wc -l)" -gt 1 ]; then
            echo "::warning::mais de um patch por componente; vale o primeiro em ordem alfabética, como no build-publish.yml"
          fi
          GSA_PATCH=$(ls patches/gsa-*.patch | head -1)
          GSAD_PATCH=$(ls patches/gsad-*.patch | head -1)
          GSA_REF=$(basename "$GSA_PATCH" .patch | sed 's/^gsa-//')
          GSAD_REF=$(basename "$GSAD_PATCH" .patch | sed 's/^gsad-//')
          for REF in "$GSA_REF" "$GSAD_REF"; do
            if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag inválida derivada do nome do patch: '$REF' (esperado vX.Y.Z)"
              exit 1
            fi
          done
          echo "gsa_ref=$GSA_REF"   >> "$GITHUB_OUTPUT"
          echo "gsad_ref=$GSAD_REF" >> "$GITHUB_OUTPUT"
          echo "Pinned -> gsa=$GSA_REF | gsad=$GSAD_REF"

      # O patch do gsad só troca strings: basta provar que aplica na tag.
      - name: gsad — aplica o patch na tag pinada
        id: gsad
        env:
          GSAD_REF: ${{ steps.refs.outputs.gsad_ref }}
        run: |
          set -eux
          git clone -q --branch "$GSAD_REF" --depth 1 https://github.com/greenbone/gsad.git gsad-src
          git -C gsad-src apply --check "$GITHUB_WORKSPACE/patches/gsad-${GSAD_REF}.patch"
          git -C gsad-src apply "$GITHUB_WORKSPACE/patches/gsad-${GSAD_REF}.patch"

      - name: gsa — aplica o patch na tag pinada
        id: gsa
        env:
          GSA_REF: ${{ steps.refs.outputs.gsa_ref }}
        run: |
          set -eux
          git clone -q --branch "$GSA_REF" --depth 1 https://github.com/greenbone/gsa.git gsa-src
          git -C gsa-src apply --check "$GITHUB_WORKSPACE/patches/gsa-${GSA_REF}.patch"
          git -C gsa-src apply "$GITHUB_WORKSPACE/patches/gsa-${GSA_REF}.patch"

      # O build de produção (.docker/prod.Dockerfile da tag) instala o Node da
      # NodeSource (ENV NODE_VERSION=node_<major>.x): usar a mesma major aqui.
      - name: Versão do Node do build de produção da tag
        id: node
        run: |
          set -eu
          MAJOR=$(sed -n 's/^ENV NODE_VERSION=node_\([0-9][0-9]*\)\.x.*$/\1/p' gsa-src/.docker/prod.Dockerfile | head -1)
          if [ -z "$MAJOR" ]; then
            MAJOR=24
            echo "::warning::NODE_VERSION não encontrado em .docker/prod.Dockerfile; usando Node $MAJOR"
          fi
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Node do build de produção: $MAJOR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: gsa-src/package-lock.json

      # Lockfile da tag; sem scripts de instalação (o .npmrc da tag já tem
      # ignore-scripts=true, e o build de produção também roda sem eles).
      - name: Dependências (npm ci)
        id: deps
        working-directory: gsa-src
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Obrigatório e em passo próprio: o Vite não checa tipos. (Na v27.4.1 o
      # "build" já é "tsc && vite build"; o passo separado aponta a causa da
      # falha e continua valendo se o script de build mudar.)
      - name: Type-check (npm run type-check = tsc --noEmit)
        id: typecheck
        working-directory: gsa-src
        run: npm run type-check

      - name: Build de produção (npm run build)
        id: build
        working-directory: gsa-src
        run: |
          set -eu
          npm run build
          test -s build/index.html

      # O Vite copia public/ sem validar: um JSON quebrado ou com chave repetida
      # num catálogo só apareceria no navegador.
      - name: Catálogos de idioma (JSON válido, sem chave repetida)
        id: locales
        # Roda mesmo com o type-check ou o build quebrados (o job continua
        # falhando): os dois problemas aparecem no mesmo run.
        if: ${{ !cancelled() && steps.gsa.outcome == 'success' }}
        working-directory: gsa-src
        run: |
          python3 - public/locales/*.json <<'PY'
          import collections
          import json
          import sys

          bad = False
          for path in sys.argv[1:]:
              try:
                  pairs = json.load(
                      open(path, encoding='utf-8'),
                      object_pairs_hook=lambda kv: kv,
                  )
              except ValueError as err:
                  print(f'::error file={path}::JSON inválido: {err}')
                  bad = True
                  continue
              counts = collections.Counter(key for key, _ in pairs)
              dups = sorted(key for key, n in counts.items() if n > 1)
              if dups:
                  print(f'::error file={path}::chaves repetidas: {dups}')
                  bad = True
              print(f'{path}: {len(pairs)} chaves')
          sys.exit(1 if bad else 0)
          PY

      # Toda chave de _()/_l() das telas da Suricatoos (os arquivos de código
      # que o patch cria, inteiros, e as chamadas que tocam linha acrescentada
      # nos arquivos que o patch altera; _() em comentário não conta) existe
      # em pt_BR e em es, com valor não vazio, e está em inglês (o padrão do
      # GSA). Em todas as chaves dos dois catálogos o valor tem os mesmos
      # {{x}} e {{- x}} da chave. E nenhum catálogo guarda tradução sem uso:
      # chave fora do gsa-en.json da tag (lido do clone, sem o patch) que
      # nenhum _() de src/ chama. Numa atualização do GSA, as traduções das
      # chaves que o upstream removeu aparecem aqui e devem ser apagadas
      # dos catálogos.
      - name: Chaves das telas da Suricatoos nos catálogos (pt_BR e es)
        id: keys
        if: ${{ !cancelled() && steps.gsa.outcome == 'success' }}
        working-directory: gsa-src
        env:
          GSA_REF: ${{ steps.refs.outputs.gsa_ref }}
        run: |
          python3 - "$GITHUB_WORKSPACE/patches/gsa-${GSA_REF}.patch" <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys

          SRC = ('.ts', '.tsx', '.js', '.jsx')
          CALL = re.compile(r'(?<![\w$.])_l?\(')
          # acento, cedilha, ñ, ¡, ¿ (× e ÷ não contam)
          NOT_ENGLISH = re.compile('[\xc0-\xd6\xd8-\xf6\xf8-\xff\xa1\xbf]')
          TOKEN = re.compile(r'\{\{(-?)\s*([^{}]*?)\s*\}\}')
          ESC = {'n': '\n', 't': '\t', 'r': '\r', 'b': '\b', 'f': '\f', 'v': '\v',
                 '0': '\0'}
          # Depois destes, "/" abre regex. Não abre depois de "<" nem de "}" (tag do
          # JSX: "</b>", "{x} />"), nem quando vem ">" em seguida ("/>").
          REGEX_PREV = set('(,=:[!&|?{;+-*%>~^')
          REGEX_WORDS = {'return', 'typeof', 'case', 'delete', 'void', 'in', 'of',
                         'new', 'throw', 'else', 'do', 'yield', 'await', 'instanceof'}


          def code_mask(text):
              """1 em cada caractere de código: fora de comentário, string, texto de
              template e regex. Aspas simples/duplas param no fim da linha."""
              n = len(text)
              code = bytearray(b'\x01') * n
              i, prev, word, depth, tpl = 0, '', '', 0, []

              def blank(a, b):
                  b = min(b, n)
                  if a < b:
                      code[a:b] = bytes(b - a)

              def template(j):
                  start = j
                  while j < n:
                      if text[j] == '\\':
                          j += 2
                      elif text[j] == '`':
                          blank(start, j)
                          return j + 1, False
                      elif text.startswith('${', j):
                          blank(start, j)
                          return j + 2, True
                      else:
                          j += 1
                  blank(start, n)
                  return n, False

              while i < n:
                  c = text[i]
                  if c in '\'"':
                      j = i + 1
                      while j < n and text[j] != c and text[j] != '\n':
                          j += 2 if text[j] == '\\' else 1
                      blank(i + 1, j)
                      i, prev, word = j + 1, c, ''
                      continue
                  if c == '`' or (c == '}' and tpl and tpl[-1] == depth - 1):
                      if c == '}':
                          tpl.pop()
                          depth -= 1
                      i, opened = template(i + 1)
                      if opened:
                          tpl.append(depth)
                          depth += 1
                      prev, word = ('{' if opened else '`'), ''
                      continue
                  if text.startswith('//', i):
                      j = text.find('\n', i)
                      j = n if j < 0 else j
                      blank(i, j)
                      i = j
                      continue
                  if text.startswith('/*', i):
                      j = text.find('*/', i + 2)
                      j = n if j < 0 else j + 2
                      blank(i, j)
                      i = j
                      continue
                  if (c == '/' and not text.startswith('/>', i)
                          and (prev == '' or prev in REGEX_PREV or word in REGEX_WORDS)):
                      j, in_class = i + 1, False
                      while j < n and text[j] != '\n':
                          if text[j] == '\\':
                              j += 2
                              continue
                          if text[j] == '[':
                              in_class = True
                          elif text[j] == ']':
                              in_class = False
                          elif text[j] == '/' and not in_class:
                              break
                          j += 1
                      blank(i, j + 1)
                      i, prev, word = j + 1, ')', ''
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                  if c.isalnum() or c in '_$':
                      word = word + c if prev and (prev.isalnum() or prev in '_$') else c
                      prev = c
                  elif not c.isspace():
                      prev, word = c, ''
                  i += 1
              return code


          def literal(text, i):
              """Literal de string em text[i] -> (valor, fim); None se dinâmico."""
              quote, out, j = text[i], [], i + 1
              while j < len(text):
                  c = text[j]
                  if c == '\\':
                      nx = text[j + 1]
                      if nx == 'u' and text[j + 2] == '{':
                          k = text.index('}', j)
                          out.append(chr(int(text[j + 3:k], 16)))
                          j = k + 1
                      elif nx == 'u':
                          out.append(chr(int(text[j + 2:j + 6], 16)))
                          j += 6
                      elif nx == 'x':
                          out.append(chr(int(text[j + 2:j + 4], 16)))
                          j += 4
                      else:
                          out.append('' if nx == '\n' else ESC.get(nx, nx))
                          j += 2
                      continue
                  if c == quote:
                      return ''.join(out), j + 1
                  if quote == '`' and text.startswith('${', j):
                      return None, i
                  out.append(c)
                  j += 1
              return None, i


          def calls(text):
              """(chave, primeira linha, última linha) de cada _('...') ou _l('...')
              que esteja em código (não em comentário nem dentro de string)."""
              mask = code_mask(text)
              for m in CALL.finditer(text):
                  if not mask[m.start()]:
                      continue
                  i, parts = m.end(), []
                  while True:
                      while i < len(text) and text[i].isspace():
                          i += 1
                      if i >= len(text) or text[i] not in '\'"`':
                          break
                      value, end = literal(text, i)
                      if value is None:
                          parts = []
                          break
                      parts.append(value)
                      i = k = end
                      while k < len(text) and text[k].isspace():
                          k += 1
                      if k < len(text) and text[k] == '+':
                          i = k + 1
                          continue
                      break
                  if parts:
                      yield (''.join(parts), text.count('\n', 0, m.start()) + 1,
                             text.count('\n', 0, i) + 1)


          def is_test(path):
              return ('/__tests__/' in path or '/__fixtures__/' in path
                      or re.search(r'\.(test|spec)\.[jt]sx?$', path))


          def placeholders(s):
              return collections.Counter(f'{{{{{dash}{name}}}}}'
                                         for dash, name in TOKEN.findall(s))


          # Arquivos do patch: criado, apagado, e as linhas que ele acrescenta
          # (numeração do arquivo novo).
          files, cur, in_hunk, n = {}, None, False, 0
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.rstrip('\n')
              m = re.match(r'diff --git a/\S+ b/(\S+)$', line)
              if m:
                  cur = files.setdefault(m.group(1), {'new': False, 'gone': False,
                                                      'added': set()})
                  in_hunk = False
              elif cur is None:
                  continue
              elif not in_hunk and line.startswith('new file mode'):
                  cur['new'] = True
              elif not in_hunk and line.startswith('deleted file mode'):
                  cur['gone'] = True
              elif line.startswith('@@ '):
                  in_hunk = True
                  n = int(re.match(r'@@ -\S+ \+(\d+)', line).group(1))
              elif in_hunk and line.startswith('+'):
                  cur['added'].add(n)
                  n += 1
              elif in_hunk and line.startswith(' '):
                  n += 1

          used = {}
          for path, info in sorted(files.items()):
              if (info['gone'] or not path.endswith(SRC) or is_test(path)
                      or not os.path.isfile(path)):
                  continue
              for key, first, last in calls(open(path, encoding='utf-8').read()):
                  if info['new'] or info['added'].intersection(range(first, last + 1)):
                      used.setdefault(key, (path, first))

          # O gsa-en.json do upstream é o da TAG, lido do clone (o patch só é aplicado
          # na árvore de trabalho): um patch que editar o gsa-en.json não esconde
          # tradução sem uso.
          tag_en = subprocess.run(['git', 'show', 'HEAD:public/locales/gsa-en.json'],
                                  capture_output=True)
          if tag_en.returncode != 0:
              print('::error::não foi possível ler o gsa-en.json da tag '
                    '(git show HEAD:public/locales/gsa-en.json): '
                    + tag_en.stderr.decode('utf-8', 'replace').strip())
              sys.exit(1)
          upstream = json.loads(tag_en.stdout.decode('utf-8'))
          cats = {lang: json.load(open(f'public/locales/gsa-{lang}.json',
                                       encoding='utf-8'))
                  for lang in ('pt_BR', 'es')}
          errors = []
          for key, (path, line) in sorted(used.items()):
              shown = json.dumps(key, ensure_ascii=False)
              for lang, cat in cats.items():
                  value = cat.get(key)
                  if not isinstance(value, str):
                      errors.append((path, line, f'chave sem tradução em {lang}: {shown}'))
                  elif not value.strip():
                      errors.append((path, line, f'valor vazio em {lang}: {shown}'))
              if NOT_ENGLISH.search(key):
                  errors.append((path, line, f'chave fora do inglês: {shown}'))

          # Placeholders: o valor tem os mesmos {{x}} / {{- x}} da chave, nem mais nem
          # menos (todas as chaves dos dois catálogos).
          for lang, cat in cats.items():
              for key, value in cat.items():
                  if isinstance(value, str) and placeholders(key) != placeholders(value):
                      errors.append((f'public/locales/gsa-{lang}.json', 1,
                                     f'placeholders diferentes da chave em {lang}: '
                                     f'{json.dumps(key, ensure_ascii=False)} -> '
                                     f'{json.dumps(value, ensure_ascii=False)}'))

          # Tradução sem uso: chave dos catálogos que não está no gsa-en.json da
          # tag e que nenhum _() de src/ chama. Numa atualização do GSA, as
          # traduções das chaves que o upstream removeu aparecem aqui e devem ser
          # apagadas dos catálogos.
          in_src = set()
          for dirpath, _dirs, names in os.walk('src'):
              for name in names:
                  path = os.path.join(dirpath, name).replace(os.sep, '/')
                  if name.endswith(SRC) and not is_test(path):
                      text = open(path, encoding='utf-8').read()
                      in_src.update(key for key, _a, _b in calls(text))
          for lang, cat in cats.items():
              for key in cat:
                  if key not in upstream and key not in in_src:
                      shown = json.dumps(key, ensure_ascii=False)
                      errors.append((f'public/locales/gsa-{lang}.json', 1,
                                     f'tradução sem uso: {shown} (fora do gsa-en.json '
                                     f'da tag e nenhum _() de src/ a chama; '
                                     f'apague a chave deste catálogo)'))

          for path, line, msg in errors:
              msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file={path},line={line}::{msg}')
          print(f'{len(used)} chaves das telas da Suricatoos conferidas em pt_BR e es; '
                f'{len(errors)} erro(s)')
          sys.exit(1 if errors else 0)
          PY

      # O bundle traz as fontes do tema (@fontsource, importadas em
      # src/index.tsx) e a UI não chama um serviço de terceiros ao abrir: o IP
      # do operador é dado pessoal, e um nó sem internet ficaria sem as fontes.
      #   a) nenhum arquivo de build/ cita fonts.googleapis.com nem
      #      fonts.gstatic.com (o tema importava as fontes de lá);
      #   b) as três famílias estão em build/assets como .woff2 e o CSS do
      #      bundle aponta para esses arquivos (sem isto, tirar as fontes do
      #      bundle passaria pela checagem a: a UI cairia em silêncio na fonte
      #      do sistema);
      #   c) nenhuma fonte vira data: URI. O CSP do nginx tem font-src 'self',
      #      que não aceita data:, e o Vite embute os arquivos menores que
      #      4 KiB (vite.config.ts do patch: assetsInlineLimit); para uma
      #      extensão que não conhece, ele declara application/octet-stream.
      #      Por isso a checagem não depende do tipo declarado:
      #        c1) no CSS, nenhum data: dentro de um @font-face;
      #        c2) em qualquer arquivo de texto de build/ (CSS, chunks de JS,
      #            HTML), nenhum data: de tipo de fonte (font/*,
      #            application/font-*, application/x-font-*,
      #            application/vnd.ms-fontobject) e nenhum que comece como um
      #            arquivo de fonte (woff2, woff, ttf ou otf em base64), seja
      #            qual for o tipo declarado. Um data: de imagem, que o CSP
      #            (img-src) aceita, não é tocado.
      - name: Fontes do bundle (sem Google Fonts, arquivos locais)
        id: fonts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: gsa-src
        run: |
          set -u
          errors=0
          test -d build/assets || { echo "::error::build/assets não existe"; exit 1; }

          hits=$(grep -rIlE 'fonts\.(googleapis|gstatic)\.com' build || true)
          for f in $hits; do
            echo "::error file=$f::o bundle referencia fonts.googleapis.com ou fonts.gstatic.com: fonte de terceiros (o IP do operador iria para o Google e um nó sem internet ficaria sem a fonte)"
            grep -noE '.{0,50}fonts\.(googleapis|gstatic)\.com.{0,50}' "$f" | head -3
            errors=$((errors + 1))
          done

          for family in inter space-grotesk jetbrains-mono; do
            if ! ls build/assets/"$family"-*.woff2 > /dev/null 2>&1; then
              echo "::error::build/assets não tem arquivos $family-*.woff2: a fonte não entrou no bundle"
              errors=$((errors + 1))
            elif ! grep -rqE "/assets/$family-[a-z-]+-[0-9]+-normal-[A-Za-z0-9_-]+\.woff2" build/assets --include='*.css'; then
              echo "::error::o CSS do bundle não aponta para os arquivos $family-*.woff2"
              errors=$((errors + 1))
            fi
          done

          # c1: o que um @font-face carrega nunca vem num data: (de qualquer tipo,
          # também application/octet-stream). -z lê o arquivo inteiro de uma vez,
          # então o bloco pode ter várias linhas (CSS sem minificar).
          for f in $(find build -type f -name '*.css'); do
            blocks=$(LC_ALL=C grep -Pzo '@font-face\s*\{[^}]*\}' "$f" | tr '\0' '\n' || true)
            if printf '%s\n' "$blocks" | grep -q 'data:'; then
              echo "::error file=$f::@font-face com data: URI no CSS do bundle (de qualquer tipo, também application/octet-stream); o CSP do nginx (font-src 'self') a recusa. Confira assetsInlineLimit no vite.config.ts"
              printf '%s\n' "$blocks" | grep -o 'data:.\{0,40\}' | head -3
              errors=$((errors + 1))
            fi
          done

          # c2: data: com tipo de fonte, ou que começa como um arquivo de fonte
          # (d09GMg = wOF2, d09GRg = wOFF, AAEAAA = ttf, T1RUTw = otf em base64),
          # em CSS, chunk de JS ou HTML: o tipo declarado não importa.
          font_data='data:(font/|application/(x-)?font|application/vnd\.ms-fontobject)|data:[^,]{0,100}base64,(d09GMg|d09GRg|AAEAAA|T1RUTw)'
          embedded=$(LC_ALL=C grep -rIlP "$font_data" build || true)
          for f in $embedded; do
            echo "::error file=$f::fonte embutida como data: URI neste arquivo do bundle (CSS, chunk de JS ou HTML); o CSP do nginx (font-src 'self') a recusa. Confira assetsInlineLimit no vite.config.ts e como a fonte é importada"
            LC_ALL=C grep -oP "($font_data).{0,20}" "$f" | cut -c1-90 | head -3
            errors=$((errors + 1))
          done

          echo "fontes no bundle: $(ls build/assets/*.woff2 2>/dev/null | wc -l) arquivos .woff2; $errors problema(s)"
          [ "$errors" -eq 0 ]

      # A suíte vitest INTEIRA do GSA, sem lista de arquivos: os testes do
      # upstream e os do patch (cliente HTTP e polling das telas da Suricatoos;
      # idioma padrão, detecção do navegador, primeira visita e datas no idioma;
      # acessibilidade, fontes locais, contraste e telas), nos três projetos do
      # vitest.config.ts da tag (web, gmp e store; um projeto novo do upstream
      # entra sozinho). Falha de qualquer teste reprova o PR; teste novo no patch
      # entra sem mexer aqui. Os testes do upstream que o fork contradiz de
      # propósito (idiomas, rodapé, cabeçalho, seletor de idioma, gráficos) e os
      # que dependem do fuso da máquina são ajustados no próprio patch: o que o
      # fork muda de propósito vira o que o teste afirma, e o fuso é fixado no
      # teste, não no runner.
      # Acessibilidade: o GSA da tag não traz eslint-plugin-jsx-a11y nem
      # equivalente (axe etc.) e este workflow não acrescenta dependência só
      # para isso; quem confere nome acessível, rótulo, aviso de erro e uso
      # pelo teclado das telas do patch são os testes de suricatoosA11y.
      # Sem tentativa extra: um teste que falha reprova o PR na primeira falha, os
      # do patch inclusive. A única tolerância fica no patch, num arquivo só, e
      # declarada no próprio teste: ScanConfigComponent.test.tsx (`{retry: 2}`)
      # procura o botão do corpo do diálogo sem esperar por ele, falhou 1 vez em 6
      # execuções completas e passa sozinho 14 de 14.
      # Erro não tratado também reprova, menos um: o timer que o Transition do
      # Mantine deixa para trás quando fecha no quadro em que abriu, e que dispara
      # depois do fim do arquivo, com a janela do jsdom já desmontada ("window is
      # not defined" em use-transition.mjs; a run da PR #155 caiu nisso com todos
      # os testes verdes). O vitest.config.ts do patch (onUnhandledError) deixa
      # passar exatamente esse e mais nenhum; o porquê e o que continua reportado
      # estão em src/web/testing/__tests__/unhandledErrors.test.ts.
      # É o último passo de conferência: os outros são rápidos e respondem
      # antes; todos rodam mesmo se um falhar.
      - name: Testes (vitest, suíte inteira do GSA)
        id: tests
        # Roda mesmo com o type-check, o build ou uma conferência quebrados (o
        # job continua falhando), desde que as dependências tenham instalado.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: gsa-src
        run: |
          set -eu
          npx vitest run

      - name: Resumo
        if: always()
        env:
          GSA_REF: ${{ steps.refs.outputs.gsa_ref }}
          GSAD_REF: ${{ steps.refs.outputs.gsad_ref }}
          NODE_MAJOR: ${{ steps.node.outputs.major }}
          R_GSAD: ${{ steps.gsad.outcome }}
          R_GSA: ${{ steps.gsa.outcome }}
          R_DEPS: ${{ steps.deps.outcome }}
          R_TYPECHECK: ${{ steps.typecheck.outcome }}
          R_BUILD: ${{ steps.build.outcome }}
          R_TESTS: ${{ steps.tests.outcome }}
          R_LOCALES: ${{ steps.locales.outcome }}
          R_KEYS: ${{ steps.keys.outcome }}
          R_FONTS: ${{ steps.fonts.outcome }}
        run: |
          {
            echo "### Patch do GSA/gsad — validação de PR"
            echo ""
            echo "Tags pinadas: gsa \`${GSA_REF:-?}\` · gsad \`${GSAD_REF:-?}\` · Node ${NODE_MAJOR:-?}"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| gsad: git apply --check + apply | ${R_GSAD:-skipped} |"
            echo "| gsa: git apply --check + apply | ${R_GSA:-skipped} |"
            echo "| npm ci | ${R_DEPS:-skipped} |"
            echo "| type-check (tsc --noEmit) | ${R_TYPECHECK:-skipped} |"
            echo "| build de produção (npm run build) | ${R_BUILD:-skipped} |"
            echo "| catálogos de idioma | ${R_LOCALES:-skipped} |"
            echo "| chaves das telas da Suricatoos (pt_BR, es) | ${R_KEYS:-skipped} |"
            echo "| fontes do bundle (sem Google Fonts, arquivos locais) | ${R_FONTS:-skipped} |"
            echo "| testes (vitest, suíte inteira do GSA) | ${R_TESTS:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
