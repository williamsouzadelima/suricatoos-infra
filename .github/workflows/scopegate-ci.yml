name: scopegate-ci

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "scopegate/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/scopegate-ci.yml"
  pull_request:
    paths:
      - "scopegate/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/scopegate-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (shared scope gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: scopegate/go.mod
      - name: gofmt (scopegate)
        run: |
          unformatted="$(gofmt -l scopegate/)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet (scopegate)
        run: go vet ./scopegate/...
      - name: build (scopegate)
        run: go build ./scopegate/...
      - name: test (scopegate, race)
        run: go test -race ./scopegate/...
