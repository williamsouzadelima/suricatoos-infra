# Suricatoos — perfil STANDALONE.
#
# Camada para deploys que rodam a stack SEM os pré-requisitos do host de
# produção: sem domínio público, sem certificado Let's Encrypt e sem a CA de
# enrollment. É o caso de um scanner instalado dentro da rede que ele audita,
# alcançado por navegador local, túnel SSH ou VPN.
#
# Uso (o override base continua valendo; este arquivo vem por último):
#   docker compose -p greenbone-community-edition \
#     -f compose.yaml -f docker-compose.override.yml -f docker-compose.standalone.yml \
#     up -d
#
# O que ele NÃO contém, de propósito: nada que identifique um host específico.
# O endereço de bind vem de SCANNER_BIND_IP (.env ao lado do compose) e as
# origens extras do anti-CSRF vêm de um snippet local — ver nginx/standalone.conf.

services:
  # ------------------------------------------------------------------
  # nginx sem domínio: certificado self-signed gerado pelo gvm-config e
  # publicação restrita.
  #
  # O compose base publica 0.0.0.0:443, o que exporia a UI do scanner — e o
  # login do admin — para toda a rede que a máquina audita. `!override` é
  # obrigatório: sem ele o compose CONCATENA as listas de ports e os dois
  # bindings disputam a porta.
  #
  # SCANNER_BIND_IP é o endereço adicional em que a UI deve escutar (uma
  # interface de VPN, por exemplo). O default 127.0.0.1 repete o loopback, o
  # que é inofensivo, e faz um deploy sem .env subir acessível só localmente
  # em vez de falhar.
  # ------------------------------------------------------------------
  nginx:
    ports: !override
      - "127.0.0.1:443:443"
      - "${SCANNER_BIND_IP:-127.0.0.1}:443:443"
      - "127.0.0.1:9392:9392"
    # `!override` tambem aqui, mas a lista REPETE os volumes do compose base:
    # nginx_config_vol traz headers.conf, nginx_certificates_vol traz o
    # certificado self-signed e gsa_data_vol traz o HTML da UI. Omiti-los
    # derruba o nginx com "headers.conf: No such file or directory".
    volumes: !override
      - nginx_config_vol:/etc/nginx/conf.d:ro
      - nginx_certificates_vol:/etc/nginx/certs:ro
      - gsa_data_vol:/usr/share/nginx/html:ro
      - ./nginx/standalone.conf:/etc/nginx/conf.d/default.conf:ro
      # Snippets locais do anti-CSRF do /feed-sync/ (ex.: o nome deste host
      # numa VPN). O diretório é versionado VAZIO e seus .conf são ignorados
      # pelo git, então hostnames de infraestrutura ficam fora do repositório.
      # Montar um DIRETÓRIO (e não um arquivo) evita a armadilha de o Docker
      # criar um diretório no lugar de um arquivo que não existe.
      # Fica FORA de /etc/nginx/conf.d: aquele caminho é o nginx_config_vol
      # montado read-only, e criar um mountpoint dentro dele falha com
      # "read-only file system".
      - ./nginx/extra:/etc/nginx/extra:ro

