# 2026-08-07 — rate-limit e anti-CSRF do feed-updater (contexto http).
limit_req_zone $binary_remote_addr zone=feedsync:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=agent_v1:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ingest:10m   rate=30r/m;
# APIs de SESSÃO da UI (/agents/data.json, /agents/scan, /agent/provision/,
# /ai-providers/api/): zona própria, como no default.conf. A agent_api (5 req/min)
# saiu deste perfil: nenhuma location daqui a usa mais (o /agent/api/ usa a agent_v1).
limit_req_zone $binary_remote_addr zone=ui_api:10m   rate=120r/m;

# Origin permitido p/ /feed-sync/ (anti-CSRF). Vazio = GET same-origin = ok.
# O nome sob o qual ESTE deploy e acessado (ex.: um nome de VPN/tailnet) NAO
# entra aqui: fica num snippet local, nao versionado, para manter hostnames de
# infraestrutura fora deste repositorio publico. O include usa glob, entao a
# ausencia do arquivo nao quebra o nginx -- um deploy que so use localhost
# funciona sem criar nada.
map $http_origin $feedsync_origin_ok {
  default 0;
  ""      1;
  "~^https://scanner\.suricatoos\.com$"  1;
  "~^https://localhost(:[0-9]+)?$"         1;
  include /etc/nginx/extra/*.conf;
}

upstream gsad {
  server gsad:9392;
}

server {
    listen 9392;
    return 301 https://$host:443$request_uri;
}

server {
  proxy_read_timeout 1h;

  client_max_body_size 1000m;

  listen 443 ssl;

  server_name localhost;

  include /etc/nginx/conf.d/headers.conf;

  ssl_certificate /etc/nginx/certs/server.cert.pem;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # ALTERADO em relacao ao default.conf da imagem: 'login' saiu desta regex.
  # O bloco original era ^/(gmp|system_report|logout|login) e mandava TUDO de
  # /login para o gsad. Mas o GSA 26.4 faz o roteamento de /login no cliente e o
  # gsad 26.4 nao serve mais essa pagina: um GET /login devolvia 404
  # "The requested URL is not available". Na pratica, bastava a sessao expirar
  # (o SPA navega para /login) e dar F5 para a aplicacao parecer fora do ar.
  # O POST de /login CONTINUA sendo do gsad — e ele que autentica — por isso a
  # separacao por metodo no bloco 'location = /login' abaixo.
  # 2026-08-07 — feed-updater (tela "Status do feed": Atualizar agora / Salvar
  # agendamento). Protegido por cookie de sessao do GSA + same-origin + rate-limit.
  location /feed-sync/ {
    # Re-inclui os headers padrao: add_header NAO herda do server quando a
    # location declara add_header proprio, entao sem isto CSP/HSTS/X-Frame
    # somem justamente nas rotas de API.
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=feedsync burst=40 nodelay;
    if ($cookie_GSAD_SID = "") { return 401; }
    if ($feedsync_origin_ok = 0) { return 403; }
    # resolver dinamico p/ sobreviver a recriacao do container feed-updater
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $feed_upstream feed-updater;
    rewrite ^/feed-sync/(.*)$ /$1 break;
    proxy_pass http://$feed_upstream:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # Validador de sessao da config de IA (gate FORTE): subrequisicao ao gsad que
  # exige cookie E token, devolvendo 401 p/ sessao ausente/forjada. A UI nativa do
  # GSA manda o token (gmp.session.token). As APIs de Agentes/Ativar Agente usam o
  # mesmo mecanismo (/_session_auth, abaixo); neste perfil so o /feed-sync/ segue
  # no gate so-cookie.
  location = /_ai_auth {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gsad_auth_ai "http://gsad:9392/gmp?cmd=get_capabilities&token=$ai_token";
    proxy_pass $gsad_auth_ai;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Config de provedores de IA (pagina nativa do GSA /ai-providers; a SPA serve a
  # rota, aqui so' a API). Proxya p/ as rotas de SESSAO do control-plane
  # (/ai/providers, SEM bearer -- este gate e' a fronteira). Tira X-Operator do cliente.
  location /ai-providers/api/ {
    set $ai_token $arg_token;
    auth_request /_ai_auth;
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=ui_api burst=20 nodelay;
    if ($cookie_GSAD_SID = "") { return 401; }
    if ($feedsync_origin_ok = 0) { return 403; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp_ai control-plane;
    rewrite ^/ai-providers/api/(.*)$ /ai/$1 break;
    proxy_pass http://$cp_ai:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Operator "";
    # Marca de portão de sessão (control-plane/sessiongate): as rotas de sessão do
    # control-plane só atendem com ela. Só as locations com portão de sessão a
    # setam; TODA outra location que vai ao control-plane a limpa, então o valor
    # que o cliente mandar nunca chega lá. Cada location declara a sua linha:
    # proxy_set_header não herda do nível de cima quando a location define algum.
    proxy_set_header X-Suricatoos-Gate "gsad-session";
    proxy_read_timeout 60s;
  }

  # 2026-08-07 — control-plane + ingest (telas "Ativar Agente" e "Agentes de Endpoint").
  # resolver dinamico p/ sobreviver a recriacao dos containers.
  #
  # Validador de sessão GENÉRICO dessas APIs (gate FORTE, como o /_ai_auth):
  # subrequisição ao gsad, que exige cookie E token e devolve 401 p/ sessão
  # ausente/forjada. Antes elas só testavam o cookie NÃO-VAZIO, o que qualquer
  # cliente forja. O token chega por $session_token, setado no pedido PAI (aqui
  # dentro $arg_token é VAZIO: a subrequisição não tem query string).
  location = /_session_auth {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gsad_auth_session "http://gsad:9392/gmp?cmd=get_capabilities&token=$session_token";
    proxy_pass $gsad_auth_session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /agents/data.json {
    set $session_token $arg_token;
    auth_request /_session_auth;
    # Re-inclui os headers padrao: add_header NAO herda do server quando a
    # location declara add_header proprio, entao sem isto CSP/HSTS/X-Frame
    # somem justamente nas rotas de API.
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=ui_api burst=20 nodelay;
    # Camadas extras (fase rewrite, ANTES do auth_request): sem cookie, 401 sem
    # nem consultar o gsad; Origin de fora, 403.
    if ($cookie_GSAD_SID = "") { return 401; }
    if ($feedsync_origin_ok = 0) { return 403; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ing ingest;
    rewrite ^/agents/data\.json$ /agents break;
    proxy_pass http://$ing:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Suricatoos-UI 1;
    proxy_read_timeout 30s;
  }

  location = /agents/scan {
    set $session_token $arg_token;
    auth_request /_session_auth;
    # Re-inclui os headers padrao: add_header NAO herda do server quando a
    # location declara add_header proprio, entao sem isto CSP/HSTS/X-Frame
    # somem justamente nas rotas de API.
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=ui_api burst=20 nodelay;
    if ($cookie_GSAD_SID = "") { return 401; }
    if ($feedsync_origin_ok = 0) { return 403; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agents/scan$ /agents/scan break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    # Marca de portão de sessão (ver /ai-providers/api/).
    proxy_set_header X-Suricatoos-Gate "gsad-session";
    proxy_read_timeout 30s;
  }

  location /agent/provision/ {
    set $session_token $arg_token;
    auth_request /_session_auth;
    # Re-inclui os headers padrao: add_header NAO herda do server quando a
    # location declara add_header proprio, entao sem isto CSP/HSTS/X-Frame
    # somem justamente nas rotas de API.
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store" always;
    if ($cookie_GSAD_SID = "") { return 401; }
    if ($feedsync_origin_ok = 0) { return 403; }
    limit_req zone=ui_api burst=20 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    # Marca de portão de sessão (ver /ai-providers/api/).
    proxy_set_header X-Suricatoos-Gate "gsad-session";
  }

  # Rotas do control-plane sob /agent/ que seguem abertas neste perfil — mesma
  # config de proxy do antigo catch-all. Não derivam identidade do cert: limpam
  # X-Client-Cert-*, X-Operator e a marca de portão que o cliente mandar.
  #   /agent/api/                  rotas com bearer (a auth é do control-plane)
  #   POST /agent/v1/enroll        enrollment do agente e do sensor (token)
  #   GET  /agent/v1/update/check  auto-update do agente (manifesto assinado)
  #   GET  /agent/v1/crl.der       ponto de distribuição da CRL embutido nos certs
  location /agent/api/ {
    limit_req zone=agent_v1 burst=30 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Cert-DN "";
    proxy_set_header X-Client-Cert-Verify "";
    proxy_set_header X-Client-Cert-Serial "";
    proxy_set_header X-Operator "";
    proxy_set_header X-Suricatoos-Gate "";
  }
  location = /agent/v1/enroll {
    limit_req zone=agent_v1 burst=30 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Cert-DN "";
    proxy_set_header X-Client-Cert-Verify "";
    proxy_set_header X-Client-Cert-Serial "";
    proxy_set_header X-Operator "";
    proxy_set_header X-Suricatoos-Gate "";
  }
  location = /agent/v1/update/check {
    limit_req zone=agent_v1 burst=30 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Cert-DN "";
    proxy_set_header X-Client-Cert-Verify "";
    proxy_set_header X-Client-Cert-Serial "";
    proxy_set_header X-Operator "";
    proxy_set_header X-Suricatoos-Gate "";
  }
  location = /agent/v1/crl.der {
    limit_req zone=agent_v1 burst=30 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cp control-plane;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass http://$cp:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Cert-DN "";
    proxy_set_header X-Client-Cert-Verify "";
    proxy_set_header X-Client-Cert-Serial "";
    proxy_set_header X-Operator "";
    proxy_set_header X-Suricatoos-Gate "";
  }

  # /agent/ FECHADO: só as rotas explícitas do control-plane (acima) passam. As
  # rotas de sessão do control-plane não têm auth própria — ver
  # control-plane/sessiongate. Este perfil não tem mTLS: os canais mTLS de agente
  # e sensor (commands, scan-jobs, heartbeat, renew, feed, remediation-jobs) ficam
  # indisponíveis aqui até a paridade de mTLS com o default.conf. Antes eles
  # passavam pelo catch-all com a identidade vinda de header, sem certificado
  # verificado.
  location /agent/ { return 404; }

  location /ingest/ {
    limit_req zone=ingest burst=20 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ing2 ingest;
    rewrite ^/ingest/(.*)$ /$1 break;
    proxy_pass http://$ing2:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }

  location ~ ^/(gmp|system_report|logout) {
    # Handle preflight requests
    if ($request_method = OPTIONS) {
          add_header Access-Control-Allow-Origin "https://localhost:443" always;
          add_header Access-Control-Allow-Credentials "true" always;
          add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
          add_header Content-Length 0 always;
          return 204;
    }
    proxy_pass http://gsad;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Match exato: tem prioridade sobre as regex acima.
  #   GET  /login -> index.html (o SPA desenha o formulario e cuida da rota)
  #   POST /login -> gsad (autenticacao de verdade)
  # O 'return 418' + error_page e o jeito canonico de desviar para uma named
  # location a partir de um if, porque 'if' com proxy_pass dentro do mesmo bloco
  # tem comportamento indefinido no nginx.
  location = /login {
    if ($request_method = OPTIONS) {
          add_header Access-Control-Allow-Origin "https://localhost:443" always;
          add_header Access-Control-Allow-Credentials "true" always;
          add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
          add_header Content-Length 0 always;
          return 204;
    }
    error_page 418 = @gsad;
    if ($request_method = POST) {
          return 418;
    }
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }

  location @gsad {
    proxy_pass http://gsad;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/config\.(js|ts) {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
